# Save as configs/stage3_gemma4_10pct.yaml
# Adapts configs/stage3_multitask.yaml (8 downstream benchmarks, 5 epochs)
decoder: "google/gemma-4-26B-A4B-it"
encoder: "Qwen/Qwen3-Embedding-4B"
attn_implementation: "sdpa"

# Continue from Stage 2 checkpoint
init_memory: "runs/gemma4_stage2/epoch-00/memory.pt"
data_repo: "./data_subsampled"
datasets:
  - "pv4"
  - "pmv2"
  - "factkg"
  - "triviaqa"
  - "narrativeqa"
  - "pubmedqa"
  - "lamp4"
  - "lamp7"
output_dir: "runs/gemma4_stage3"

num_memories: 16

# Single-device batching (Matches official Stage 3 effective batch size: 2 x 32 x 1 = 64)
devices: 1
strategy: "auto"
num_workers: 0
batch_size: 8
gradient_accumulation_steps: 16
max_epochs: 5

# Official Stage 3 learning rate and regularization (bf16-mixed)
learning_rate: 1.0e-4
weight_decay: 0.01
seed: 23
